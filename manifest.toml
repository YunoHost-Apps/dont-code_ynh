#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "dont-code"
name = "Dont-code"
description.en = "Low-code/no-code platform with dashboard, project/data services and plugin host"
description.fr = "Plateforme low-code/no-code avec tableau de bord, services projet/données et hôte de plugins"

version = "1.5.1~ynh3"

maintainers = ["Dont-code Team"]

[upstream]
license = "AGPL-3.0-or-later"
website = "https://dont-code.net"
demo = "https://dont-code.net/apps.html"
admindoc = "https://dont-code.net/developers.html"
userdoc = "https://dont-code.net/news.html"
code = "https://github.com/dont-code"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64"]
multi_instance = true
ldap = false
sso = false
disk = "1G"
ram.build = "500M"
ram.runtime = "1500M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/dont-code"

    [install.tenant]
    ask.en = "The name of the tenant these services will support. This configures database names to use. Can be empty if not necessary."
    ask.fr = "Le nom du tenant associé à ces services. Permet de configurer des bases de données séparées. Peut être vide si non nécessaire."
    type = "string"
    optional = true

    [install.public_key]
    ask.en = "SSH Public key to allow service updates as part of delivery process, leave empty to disable."
    ask.fr = "Clef publique SSH permettant la mise à jour des services via un déploiement automatique, inactif si non renseigné."
    type = "string"
    optional = true

    [install.mistral_key]
    ask.en = "Enable application generation through prompts by setting your Mistral API Key here, or NONE to disable."
    ask.fr = "En renseignant une clef d'API Mistral, vous avez la possibilité de générer une application avec un simple prompt, inactif avec la valeur NONE."
    type = "string"
    optional = false
    default = "NONE"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    url = "https://github.com/dont-code/dont-code/releases/download/v1.5.1-next/dont-code-1.5.1-next.tar.gz"
    sha256 = "c9d0b606888c4126f2210a2ed5e2340ec725ab9cf5ecbbff146c8c15b3eb9834"
    in_subdir = true
    autoupdate.strategy = "latest_github_release"
    autoupdate.asset = "dont-code-.*\\.tar\\.gz"
    autoupdate.upstream = "https://github.com/dont-code/dont-code"

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:r-x"

    [resources.data_dir]
    subdirs = ["docs", "web", "test"]
    owner = "__APP__:rwx"
    group = "www-data:rwx"

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    project.default = 8083
    data.default = 8084

    [resources.apt]
    packages = [
        "ca-certificates",
        "curl",
        "tar",
    ]
