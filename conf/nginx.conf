#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;

# Services status page (checks the Java services)
location __PATH__/test {
    alias __DATA_DIR__/test/;
    index index.html;
    more_set_headers "Cache-Control: no-store";
}

# Dashboard (SPA) - default
location __PATH__/ {
    alias __DATA_DIR__/web/dashboard/;
    index index.html;
    try_files $uri $uri/ __PATH__/index.html;
    expires 1h;
    more_set_headers "Cache-Control: public";
}

# Project services API
location __PATH__/project {
    proxy_pass http://127.0.0.1:__PORT_PROJECT__/project;
    include proxy_params_no_auth;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    # CORS support
    more_set_headers 'Access-Control-Allow-Origin: *';

    # Handling preflight requests
    if ($request_method = OPTIONS) {
        more_set_headers 'Access-Control-Allow-Methods: *' 'Access-Control-Allow-Headers: *';
        return 200;
    }
}

location __PATH__/generate {
    proxy_pass http://127.0.0.1:__PORT_PROJECT__/generate;
    include proxy_params_no_auth;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    # CORS support
    more_set_headers 'Access-Control-Allow-Origin: *';

    # Handling preflight requests
    if ($request_method = OPTIONS) {
        more_set_headers 'Access-Control-Allow-Methods: *' 'Access-Control-Allow-Headers: *';
        return 200;
    }
}

# Data services API
location __PATH__/data {
    proxy_pass http://127.0.0.1:__PORT_DATA__/data;
    include proxy_params_no_auth;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 100M;
    # CORS support
    more_set_headers 'Access-Control-Allow-Origin: *';

    # Handling preflight requests
    if ($request_method = OPTIONS) {
        more_set_headers 'Access-Control-Allow-Methods: *' 'Access-Control-Allow-Headers: *';
        return 200;
    }
}

location __PATH__/documents {
    proxy_pass http://127.0.0.1:__PORT_DATA__/documents;
    include proxy_params_no_auth;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 100M;
    # CORS support
    more_set_headers 'Access-Control-Allow-Origin: *';

    # Handling preflight requests
    if ($request_method = OPTIONS) {
        more_set_headers 'Access-Control-Allow-Methods: *' 'Access-Control-Allow-Headers: *';
        return 200;
    }
}

# Uploaded documents served statically (document-external-url points here)
location __PATH__/docs/ {
    alias __DATA_DIR__/docs/;
    try_files $uri =404;
    expires 1h;
    more_set_headers "Cache-Control: public";
}

# Static plugin/host apps
location __PATH__/apps/ {
    alias __DATA_DIR__/web/apps/;
    try_files $uri $uri/ =404;
    expires 1h;
    more_set_headers "Cache-Control: public";
}
